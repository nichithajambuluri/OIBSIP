<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queries · Lumina</title><link rel="stylesheet" href="/styles.css"></head><body><div th:replace="~{fragments :: sidebar('queries')}"></div><main class="main"><div th:replace="~{fragments :: topbar('Reader queries','Questions and feedback from your community.')}"></div><section class="content"><div th:replace="~{fragments :: alerts}"></div><div class="two-col"><div class="form-card"><div class="eyebrow">WE'RE HERE TO HELP</div><h2>Contact the library</h2><form method="post" action="/queries/save"><label>Your name</label><input name="name" required placeholder="Your name"><label>Email address</label><input name="email" type="email" required placeholder="you@example.com"><label>How can we help?</label><textarea name="message" required rows="5" placeholder="Write your question or feedback…"></textarea><button class="btn primary full">Send message →</button></form></div><div><div class="section-head no-margin"><div><div class="eyebrow">INBOX</div><h2>Recent messages</h2></div></div><div class="query-card" th:each="q:${queries}"><div class="query-top"><b th:text="${q.name}">Reader</b><span class="status" th:classappend="${q.resolved}?' status-green':' status-amber'" th:text="${q.resolved}?'RESOLVED':'OPEN'">OPEN</span></div><small th:text="${q.email}">email</small><p th:text="${q.message}">Message</p><form th:if="${!q.resolved}" method="post" th:action="@{/queries/{id}/resolve(id=${q.id})}"><button class="text-link">Mark resolved →</button></form></div><div th:if="${#lists.isEmpty(queries)}" class="empty">Your inbox is clear.</div></div></div></section></main></body></html>
