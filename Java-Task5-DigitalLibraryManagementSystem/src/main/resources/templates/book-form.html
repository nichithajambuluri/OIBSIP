<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book details · Lumina</title><link rel="stylesheet" href="/styles.css"></head><body><div th:replace="~{fragments :: sidebar('books')}"></div><main class="main"><div th:replace="~{fragments :: topbar('Book details','Give every title a place on the shelf.')}"></div><section class="content"><div class="form-card"><div class="eyebrow">CATALOGUE MANAGEMENT</div><h2 th:text="${formTitle}">Add a book</h2><form method="post" action="/books/save" th:object="${book}"><input type="hidden" th:field="*{id}"><div class="form-grid"><div class="field wide"><label>Book title</label><input th:field="*{title}" required placeholder="e.g. The Creative Act"></div><div class="field"><label>Author</label><input th:field="*{author}" required placeholder="Author name"></div><div class="field"><label>ISBN</label><input th:field="*{isbn}" required placeholder="ISBN number"></div><div class="field"><label>Category</label><input th:field="*{category}" required placeholder="e.g. Fiction"></div><div class="field"><label>Total quantity</label><input type="number" min="0" th:field="*{quantity}" required></div></div><div class="form-actions"><a class="btn secondary" href="/books">Cancel</a><button class="btn primary">Save book <span>→</span></button></div></form></div></section></main></body></html>
