<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogue · Lumina</title><link rel="stylesheet" href="/styles.css"></head><body><div th:replace="~{fragments :: sidebar('books')}"></div><main class="main"><div th:replace="~{fragments :: topbar('Book catalogue','Discover, organize and care for every title.')}"></div><section class="content"><div th:replace="~{fragments :: alerts}"></div><div class="toolbar"><form class="search-form" method="get" action="/books"><span>⌕</span><input name="q" th:value="${q}" placeholder="Search title, author or ISBN…"><select name="category"><option value="">All categories</option><option th:each="c:${categories}" th:value="${c}" th:text="${c}" th:selected="${category==c}"></option></select><button class="btn secondary">Search</button></form><a class="btn primary" href="/books/new">＋ Add a book</a></div><div class="table-card"><table><thead><tr><th>BOOK</th><th>ISBN</th><th>CATEGORY</th><th>STOCK</th><th>AVAILABILITY</th><th>ACTIONS</th></tr></thead><tbody><tr th:each="b:${books}"><td><div class="table-book"><span class="mini-cover">▤</span><div><b th:text="${b.title}">Title</b><small th:text="${b.author}">Author</small></div></div></td><td th:text="${b.isbn}">ISBN</td><td><span class="tag" th:text="${b.category}">Category</span></td><td th:text="${b.quantity}">0</td><td><span class="status" th:classappend="${b.available>0}?' status-green':' status-amber'" th:text="${b.available>0}?${b.available}+' available':'Unavailable'">Available</span></td><td><div class="actions"><a class="text-link" th:href="@{/books/{id}/edit(id=${b.id})}">Edit</a><form method="post" th:action="@{/books/{id}/delete(id=${b.id})}" onsubmit="return confirm('Delete this book?')"><button class="link-danger">Delete</button></form></div></td></tr><tr th:if="${#lists.isEmpty(books)}"><td colspan="6" class="empty">No books found. Try another search or add a title.</td></tr></tbody></table></div></section></main></body></html>
