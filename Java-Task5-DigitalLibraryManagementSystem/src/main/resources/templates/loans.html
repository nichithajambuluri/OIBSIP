<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue & Return · Lumina</title><link rel="stylesheet" href="/styles.css"></head><body><div th:replace="~{fragments :: sidebar('loans')}"></div><main class="main"><div th:replace="~{fragments :: topbar('Issue & return','Every loan, due date and return in one place.')}"></div><section class="content"><div th:replace="~{fragments :: alerts}"></div><div class="form-card compact-form"><div class="eyebrow">NEW LOAN</div><h2>Issue a book</h2><form method="post" action="/loans/issue" class="inline-form"><div class="field"><label>Choose book</label><select name="bookId" required><option th:each="b:${books}" th:if="${b.available>0}" th:value="${b.id}" th:text="${b.title} + ' (' + ${b.available} + ' available)'"></option></select></div><div class="field"><label>Choose member</label><select name="memberId" required><option th:each="u:${members}" th:value="${u.id}" th:text="${u.name}"></option></select></div><button class="btn primary">Issue for 14 days →</button></form></div><div class="section-head"><div><div class="eyebrow">CIRCULATION DESK</div><h2>Loan register</h2><p>Fine is calculated at ₹5 for each overdue day.</p></div></div><div class="table-card"><table><thead><tr><th>BOOK / MEMBER</th><th>ISSUED</th><th>DUE DATE</th><th>STATUS</th><th>FINE</th><th>ACTION</th></tr></thead><tbody><tr th:each="l:${loans}"><td><div class="table-book"><span class="mini-cover">↔</span><div><b th:text="${l.bookTitle}">Book</b><small th:text="${l.memberName}">Member</small></div></div></td><td th:text="${l.issueDate}">Date</td><td th:text="${l.dueDate}">Date</td><td><span class="status" th:classappend="${l.status=='ISSUED'}?' status-amber':' status-green'" th:text="${l.status}">ISSUED</span></td><td th:text="'₹' + ${l.fine}">₹0</td><td><form th:if="${l.status=='ISSUED'}" method="post" th:action="@{/loans/{id}/return(id=${l.id})}" onsubmit="return confirm('Confirm book return?')"><button class="btn small secondary">Return</button></form><form th:if="${l.status=='RETURNED' and l.fine>0 and !l.finePaid}" method="post" th:action="@{/loans/{id}/fine-paid(id=${l.id})}"><button class="btn small secondary">Mark fine paid</button></form><span th:if="${l.status=='RETURNED' and (l.fine==0 or l.finePaid)}" class="muted">Complete</span></td></tr><tr th:if="${#lists.isEmpty(loans)}"><td colspan="6" class="empty">No loans yet. Issue the first book above.</td></tr></tbody></table></div></section></main></body></html>
