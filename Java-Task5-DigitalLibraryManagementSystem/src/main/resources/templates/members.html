<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Members · Lumina</title><link rel="stylesheet" href="/styles.css"></head><body><div th:replace="~{fragments :: sidebar('members')}"></div><main class="main"><div th:replace="~{fragments :: topbar('Members','The people who bring your library to life.')}"></div><section class="content"><div th:replace="~{fragments :: alerts}"></div><div class="two-col"><div class="form-card"><div class="eyebrow">COMMUNITY</div><h2>Register a member</h2><form method="post" action="/members/save"><label>Full name</label><input name="name" required placeholder="Reader's full name"><label>Email address</label><input type="email" name="email" required placeholder="reader@example.com"><label>Phone (optional)</label><input name="phone" placeholder="Mobile number"><button class="btn primary full">Add member →</button></form></div><div class="table-card"><div class="card-heading"><div><h2>Library members</h2><p>Registered readers and staff.</p></div><span class="count-pill" th:text="${#lists.size(members)} + ' people'">2 people</span></div><div class="member-list"><div class="member-row" th:each="u:${members}"><span class="member-avatar" th:text="${u.name.substring(0,1)}">R</span><div class="member-copy"><b th:text="${u.name}">Name</b><small th:text="${u.email}">email</small></div><span class="tag" th:text="${u.role}">MEMBER</span></div></div></div></div></section></main></body></html>
