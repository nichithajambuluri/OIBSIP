<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservations · Lumina</title><link rel="stylesheet" href="/styles.css"></head><body><div th:replace="~{fragments :: sidebar('reservations')}"></div><main class="main"><div th:replace="~{fragments :: topbar('Reservations','Keep a place in line for sought-after books.')}"></div><section class="content"><div th:replace="~{fragments :: alerts}"></div><div class="form-card compact-form"><div class="eyebrow">WAITING LIST</div><h2>Reserve a title</h2><p class="muted">Add a member to the waiting list for a book.</p><form method="post" action="/reservations/save" class="inline-form"><div class="field"><label>Book</label><select name="bookId" required><option th:each="b:${books}" th:value="${b.id}" th:text="${b.title}"></option></select></div><div class="field"><label>Member</label><select name="memberId" required><option th:each="u:${members}" th:value="${u.id}" th:text="${u.name}"></option></select></div><button class="btn primary">Add reservation →</button></form></div><div class="table-card"><table><thead><tr><th>BOOK</th><th>MEMBER</th><th>REQUESTED</th><th>STATUS</th></tr></thead><tbody><tr th:each="r:${reservations}"><td th:text="${r.bookTitle}">Book</td><td th:text="${r.memberName}">Member</td><td th:text="${#temporals.format(r.createdAt,'dd MMM yyyy, HH:mm')}">Date</td><td><span class="status status-amber" th:text="${r.status}">WAITING</span></td></tr><tr th:if="${#lists.isEmpty(reservations)}"><td colspan="4" class="empty">No reservations yet.</td></tr></tbody></table></div></section></main></body></html>
