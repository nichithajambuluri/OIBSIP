<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<aside th:fragment="sidebar(active)" class="sidebar"><a class="brand" href="/dashboard"><span class="brand-mark">L</span><span><b>Lumina</b><small>KNOWLEDGE, CURATED</small></span></a><div class="nav-label">WORKSPACE</div>
<a th:classappend="${active=='dashboard'}?' active'" href="/dashboard"><span>◫</span> Overview</a><a th:classappend="${active=='books'}?' active'" href="/books"><span>▤</span> Book catalogue</a><a th:classappend="${active=='members'}?' active'" href="/members"><span>♙</span> Members</a><a th:classappend="${active=='loans'}?' active'" href="/loans"><span>↔</span> Issue &amp; return</a><a th:classappend="${active=='reservations'}?' active'" href="/reservations"><span>◷</span> Reservations</a><a th:classappend="${active=='queries'}?' active'" href="/queries"><span>✉</span> Queries</a>
<div class="sidebar-bottom"><div class="mini-avatar">LL</div><div><b>Library workspace</b><small>Local demo environment</small></div><a href="/logout">↗</a></div></aside>
<header th:fragment="topbar(title,subtitle)" class="topbar"><div><div class="eyebrow">LIBRARY OPERATIONS / <span th:text="${title}">OVERVIEW</span></div><h1 th:text="${title}">Overview</h1><p th:text="${subtitle}">A calm place to manage your collection.</p></div><div class="top-actions"><span class="live-dot"></span><span>Workspace ready</span><div class="avatar" th:text="${name != null ? name.substring(0,1) : 'L'}">L</div></div></header>
<div th:fragment="alerts" class="alerts"><div th:if="${success}" class="alert success" th:text="${success}"></div><div th:if="${error}" class="alert error" th:text="${error}"></div></div></body></html>
